<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>멍스쿨 · 함께 자라는 강아지</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="icon" href="data:,">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;
    font-family:'Apple SD Gothic Neo','Pretendard','Malgun Gothic',sans-serif;}
  :root{
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
    --cream:#fffaf2; --ink:#2c3f3a; --sub:#7d9a92;
    --mint:#5fcfb4; --mint-d:#249b81; --amber:#ffb454; --amber-d:#d9832b;
    --rose:#ff8fa8; --sky:#7cc4f0; --lock:#c3d2ce;
  }
  html,body{height:100%;}
  body{background:#eef8f2;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;}

  /* ── 화면 전환 ── */
  .scr{position:fixed;inset:0;display:none;flex-direction:column;
       padding-top:var(--st);padding-bottom:var(--sb);}
  .scr.on{display:flex;animation:sIn .3s cubic-bezier(.2,.9,.3,1);}
  @keyframes sIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  /* ══ 홈 ══ */
  #home{background:linear-gradient(#dff2ea 0%,#eef8f2 46%,#fff6e8 100%);}
  #room{position:absolute;left:0;right:0;top:0;height:66%;
        background:url('./assets/training-room-bright-v1.webp') center 42%/cover no-repeat;
        -webkit-mask-image:linear-gradient(#000 62%,transparent);
        mask-image:linear-gradient(#000 62%,transparent);opacity:.5;}

  .topbar{position:relative;z-index:3;display:flex;gap:7px;align-items:center;padding:12px 14px 0;}
  .chip{display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:999px;
        background:rgba(255,255,255,.86);box-shadow:0 3px 12px rgba(60,110,95,.13);
        font-size:12px;font-weight:900;color:#4a6d64;}
  .chip b{font-size:14px;color:var(--mint-d);}
  .chip.fire b{color:var(--amber-d);}
  .grow{flex:1;}
  #lvWrap{position:relative;z-index:3;margin:9px 14px 0;}
  #lvBar{height:9px;border-radius:6px;background:rgba(95,207,180,.2);overflow:hidden;}
  #lvBar i{display:block;height:100%;border-radius:6px;
           background:linear-gradient(90deg,var(--mint),var(--mint-d));
           transition:width .9s cubic-bezier(.2,.9,.3,1);}
  #lvTxt{display:flex;justify-content:space-between;margin-top:5px;font-size:10.5px;font-weight:800;color:var(--sub);}

  #stage{position:relative;z-index:2;flex:1;display:flex;align-items:flex-end;justify-content:center;}
  #dogWrap{position:relative;margin-bottom:2vh;}
  #dogCv{display:block;width:min(300px,66vw);height:auto;
         filter:drop-shadow(0 16px 16px rgba(60,100,85,.18));}
  #dogShadow{position:absolute;left:22%;right:22%;bottom:4px;height:16px;border-radius:50%;
             background:radial-gradient(ellipse,rgba(60,100,85,.30),transparent 72%);filter:blur(4px);}
  #bubble{position:absolute;left:50%;top:-6px;transform:translateX(-50%) scale(.9);
          padding:9px 15px;border-radius:16px;background:#fff;color:#41645c;
          font-size:12.5px;font-weight:800;white-space:nowrap;opacity:0;
          box-shadow:0 6px 18px rgba(60,110,95,.18);transition:opacity .3s,transform .3s;}
  #bubble.on{opacity:1;transform:translateX(-50%) scale(1);}
  #bubble::after{content:'';position:absolute;left:50%;bottom:-6px;margin-left:-6px;
                 border:6px solid transparent;border-top-color:#fff;border-bottom:0;}

  /* 케어 3버튼 */
  #care{position:relative;z-index:3;display:flex;justify-content:center;gap:12px;padding:0 14px 10px;}
  .careBtn{width:62px;height:62px;border:0;border-radius:20px;background:#fff;
           box-shadow:0 6px 16px rgba(60,110,95,.15);display:flex;flex-direction:column;
           align-items:center;justify-content:center;gap:2px;transition:transform .18s,opacity .18s;}
  .careBtn span{font-size:22px;line-height:1;}
  .careBtn small{font-size:9px;font-weight:900;color:var(--sub);}
  .careBtn:active{transform:scale(.92);}
  .careBtn.done{opacity:.42;}
  .careBtn.done small{color:var(--mint-d);}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
  .careBtn.pop{animation:pop .45s ease;}

  /* 하단 큰 버튼 2개 */
  #acts{position:relative;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 14px;}
  .big{border:0;border-radius:20px;padding:15px 10px 13px;color:#fff;text-align:left;
       box-shadow:0 8px 20px rgba(60,110,95,.20);transition:transform .16s;}
  .big:active{transform:translateY(2px) scale(.985);}
  .big em{display:block;font-style:normal;font-size:21px;line-height:1;margin-bottom:6px;}
  .big strong{display:block;font-size:14.5px;font-weight:1000;letter-spacing:-.4px;}
  .big small{display:block;margin-top:3px;font-size:10.5px;font-weight:700;opacity:.88;}
  #btnTrain{background:linear-gradient(140deg,#6dd6bb,#249b81);}
  #btnLearn{background:linear-gradient(140deg,#ffc06a,#e08a2c);}
  #btnLearn.hasNew::after{content:'';position:absolute;}
  .big{position:relative;}
  .dotNew{position:absolute;right:11px;top:11px;width:10px;height:10px;border-radius:50%;
          background:var(--rose);box-shadow:0 0 0 3px rgba(255,143,168,.3);}

  /* ══ 공통 헤더 ══ */
  .hd{display:flex;align-items:center;gap:10px;padding:12px 14px;}
  .back{width:38px;height:38px;border:0;border-radius:12px;background:rgba(255,255,255,.9);
        font-size:17px;color:#4a6d64;box-shadow:0 3px 10px rgba(60,110,95,.12);}
  .hd h2{font-size:17px;font-weight:1000;letter-spacing:-.5px;}
  .hd p{font-size:11px;color:var(--sub);font-weight:700;margin-top:2px;}

  /* ══ 스킬트리 ══ */
  #tree{background:linear-gradient(#f2f9f5,#fff8ee);}
  #treeScroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:4px 0 24px;}
  .unit{margin:14px 14px 4px;padding:11px 14px;border-radius:16px;color:#fff;
        background:linear-gradient(120deg,#7fd8c0,#3aa88e);box-shadow:0 6px 16px rgba(58,168,142,.22);}
  .unit.u2{background:linear-gradient(120deg,#ffc879,#e2913a);box-shadow:0 6px 16px rgba(226,145,58,.22);}
  .unit.u3{background:linear-gradient(120deg,#9fc9f5,#4b93d6);box-shadow:0 6px 16px rgba(75,147,214,.22);}
  .unit.u4{background:linear-gradient(120deg,#ffa8bd,#e06584);box-shadow:0 6px 16px rgba(224,101,132,.22);}
  .unit b{display:block;font-size:14.5px;font-weight:1000;}
  .unit small{display:block;font-size:10.5px;opacity:.92;font-weight:700;margin-top:2px;}
  .path{position:relative;padding:6px 0 2px;}
  .node{position:relative;display:block;margin:0 auto;width:78px;text-align:center;background:none;border:0;}
  .node .ball{width:70px;height:70px;margin:0 auto;border-radius:50%;display:flex;
              align-items:center;justify-content:center;font-size:29px;
              background:#fff;box-shadow:0 6px 0 #cfe3dc,0 10px 20px rgba(60,110,95,.16);
              transition:transform .16s,box-shadow .16s;}
  .node:active .ball{transform:translateY(3px);box-shadow:0 3px 0 #cfe3dc,0 6px 12px rgba(60,110,95,.14);}
  .node.locked .ball{background:#e4ede9;box-shadow:0 6px 0 #d2ded9;color:var(--lock);}
  .node.locked .lb{color:var(--lock);}
  .node.cur .ball{background:linear-gradient(150deg,#ffd58a,#f7a23c);
                  box-shadow:0 6px 0 #cf8226,0 12px 24px rgba(224,145,50,.34);}
  .node.cur::before{content:'';position:absolute;left:50%;top:35px;width:92px;height:92px;
                    margin:-46px 0 0 -46px;border-radius:50%;border:2px solid rgba(247,162,60,.5);
                    animation:ring 1.9s ease-out infinite;}
  @keyframes ring{0%{transform:scale(.82);opacity:.85}100%{transform:scale(1.22);opacity:0}}
  .node.done .ball{background:linear-gradient(150deg,#8fe0c8,#31a488);box-shadow:0 6px 0 #23806a,0 10px 20px rgba(49,164,136,.3);}
  .lb{display:block;margin-top:6px;font-size:11px;font-weight:900;color:#41645c;letter-spacing:-.3px;}
  .stars{display:block;margin-top:2px;font-size:9.5px;color:var(--amber-d);letter-spacing:1px;height:12px;}
  .link{width:5px;height:20px;margin:1px auto;border-radius:3px;background:#d8e8e2;}
  .node.off1{margin-left:24%;} .node.off2{margin-right:24%;}

  /* ══ 스킬 상세 시트 ══ */
  #sheet{position:fixed;inset:0;z-index:60;display:none;align-items:flex-end;
         background:rgba(38,62,56,.42);backdrop-filter:blur(4px);}
  #sheet.on{display:flex;}
  #sheetCard{width:100%;border-radius:24px 24px 0 0;background:var(--cream);
             padding:20px 18px calc(var(--sb) + 18px);animation:up .32s cubic-bezier(.2,.9,.3,1);}
  @keyframes up{from{transform:translateY(100%)}to{transform:none}}
  #sheetIcon{font-size:40px;text-align:center;}
  #sheetName{margin-top:8px;font-size:20px;font-weight:1000;text-align:center;letter-spacing:-.5px;}
  #sheetWhy{margin-top:9px;padding:12px 14px;border-radius:14px;background:rgba(95,207,180,.13);
            font-size:12.5px;line-height:1.7;color:#3f6259;font-weight:600;}
  #sheetHow{margin-top:10px;display:flex;align-items:center;gap:10px;padding:11px 14px;
            border-radius:14px;background:#fff;box-shadow:0 3px 10px rgba(60,110,95,.1);}
  #sheetHow .hg{font-size:26px;}
  #sheetHow div b{display:block;font-size:12.5px;font-weight:900;}
  #sheetHow div small{display:block;font-size:11px;color:var(--sub);font-weight:700;margin-top:2px;}
  #sheetGo{width:100%;min-height:54px;margin-top:14px;border:0;border-radius:16px;
           background:linear-gradient(140deg,#6dd6bb,#249b81);color:#fff;font-size:16px;font-weight:1000;
           box-shadow:0 8px 20px rgba(36,155,129,.3);}
  #sheetGo.lock{background:#dfe9e5;color:#9db2ac;box-shadow:none;}
  #sheetClose{width:100%;min-height:46px;margin-top:8px;border:0;border-radius:14px;
              background:transparent;color:var(--sub);font-size:13px;font-weight:800;}

  /* ══ 훈련하기 목록 ══ */
  #train{background:linear-gradient(#f2f9f5,#fff8ee);}
  #trainList{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px 14px 24px;}
  .tRow{display:flex;align-items:center;gap:12px;width:100%;margin-bottom:9px;padding:13px 14px;
        border:0;border-radius:16px;background:#fff;text-align:left;
        box-shadow:0 4px 12px rgba(60,110,95,.1);transition:transform .15s;}
  .tRow:active{transform:scale(.985);}
  .tRow .ti{font-size:26px;}
  .tRow .tn{flex:1;}
  .tRow .tn b{display:block;font-size:14px;font-weight:1000;}
  .tRow .tn small{display:block;font-size:10.5px;color:var(--sub);font-weight:700;margin-top:2px;}
  .tRow .tg{font-size:22px;opacity:.85;}
  .empty{margin-top:34px;text-align:center;color:var(--sub);font-size:13px;font-weight:700;line-height:1.9;}

  /* 토스트 */
  #toast{position:fixed;left:50%;bottom:calc(var(--sb) + 96px);transform:translateX(-50%) translateY(14px);
         z-index:90;padding:11px 18px;border-radius:14px;background:rgba(35,58,52,.94);color:#fff;
         font-size:12.5px;font-weight:800;opacity:0;transition:opacity .28s,transform .28s;pointer-events:none;
         max-width:86vw;text-align:center;line-height:1.5;}
  #toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 재회 카드 */
  #reunion{position:fixed;inset:0;z-index:80;display:none;align-items:center;justify-content:center;
           padding:22px;background:rgba(223,242,234,.9);backdrop-filter:blur(10px);}
  #reunion.on{display:flex;}
  #reCard{width:100%;max-width:330px;border-radius:24px;padding:24px 20px 18px;background:var(--cream);
          text-align:center;box-shadow:0 24px 60px rgba(50,90,78,.24);}
  #reEmo{font-size:46px;}
  #reTitle{margin-top:10px;font-size:20px;font-weight:1000;letter-spacing:-.5px;}
  #reMsg{margin-top:7px;font-size:13px;line-height:1.7;color:#5f7f77;font-weight:600;}
  #reDelta{margin-top:12px;font-size:12.5px;font-weight:900;min-height:18px;}
  #reDelta.down{color:#cf6a45;} #reDelta.up{color:var(--mint-d);}
  #reGo{width:100%;min-height:52px;margin-top:16px;border:0;border-radius:16px;
        background:linear-gradient(140deg,#6dd6bb,#249b81);color:#fff;font-size:16px;font-weight:1000;}
</style>
</head>
<body>

<!-- ══════════ 홈 ══════════ -->
<section class="scr on" id="home">
  <div id="room"></div>
  <div class="topbar">
    <div class="chip">유대 <b id="cBond">0</b></div>
    <div class="chip fire">🔥 <b id="cStreak">0</b>일</div>
    <div class="grow"></div>
    <div class="chip">🎓 <b id="cSkill">0</b>/10</div>
  </div>
  <div id="lvWrap">
    <div id="lvBar"><i id="lvFill"></i></div>
    <div id="lvTxt"><span id="lvL">Lv 1 · 낯선 사이</span><span id="lvR">0 / 20</span></div>
  </div>

  <div id="stage">
    <div id="dogWrap">
      <div id="bubble">반가워요!</div>
      <canvas id="dogCv" width="313" height="313"></canvas>
      <div id="dogShadow"></div>
    </div>
  </div>

  <div id="care">
    <button class="careBtn" data-care="food"><span>🍚</span><small>밥</small></button>
    <button class="careBtn" data-care="water"><span>💧</span><small>물</small></button>
    <button class="careBtn" data-care="play"><span>🎾</span><small>놀기</small></button>
  </div>

  <div id="acts">
    <button class="big" id="btnTrain"><em>🐾</em><strong>훈련하기</strong><small>배운 기술 연습</small></button>
    <button class="big" id="btnLearn"><em>📖</em><strong>새 훈련 배우기</strong><small>다음 기술 해금</small></button>
  </div>
</section>

<!-- ══════════ 스킬트리 ══════════ -->
<section class="scr" id="tree">
  <div class="hd">
    <button class="back" data-go="home">←</button>
    <div><h2>훈련 코스</h2><p id="treeSub">하나씩 배워 나가요</p></div>
  </div>
  <div id="treeScroll"></div>
</section>

<!-- ══════════ 훈련하기 ══════════ -->
<section class="scr" id="train">
  <div class="hd">
    <button class="back" data-go="home">←</button>
    <div><h2>훈련하기</h2><p>배운 기술을 다시 연습해요</p></div>
  </div>
  <div id="trainList"></div>
</section>

<!-- 스킬 시트 -->
<div id="sheet"><div id="sheetCard">
  <div id="sheetIcon">🐕</div>
  <div id="sheetName">기술</div>
  <div id="sheetWhy"></div>
  <div id="sheetHow"><div class="hg" id="sheetHg">✋</div>
    <div><b id="sheetHn">손 신호</b><small id="sheetHs"></small></div></div>
  <button id="sheetGo">배우러 가기</button>
  <button id="sheetClose">닫기</button>
</div></div>

<!-- 재회 -->
<div id="reunion"><div id="reCard">
  <div id="reEmo">🐶</div>
  <div id="reTitle"></div>
  <div id="reMsg"></div>
  <div id="reDelta"></div>
  <button id="reGo">만나러 가기</button>
</div></div>

<div id="toast"></div>

<script>
(function(){
var $=function(i){return document.getElementById(i);};

/* ═══════════ 훈련 코스 데이터 ═══════════
   각 기술은 "왜 필요한가(교육)" + "어떤 손 신호인가(입력)"를 함께 가진다.
   gesture 는 mobile.html 의 GESTURE_MAP 과 같은 키를 쓴다. */
var UNITS=[
 {t:'처음 만나기', s:'서두르지 않는 법부터', c:''},
 {t:'기본 신호',   s:'손으로 말 거는 법',   c:'u2'},
 {t:'타이밍',      s:'1초가 만드는 차이',   c:'u3'},
 {t:'어려운 순간', s:'흥분과 낯섦 다루기',  c:'u4'}
];
var SKILLS=[
 {id:'distance', u:0, i:'🚦', n:'안전거리', g:'stay',   gi:'✋', gn:'손바닥 펴기',
  why:'개에게 먼저 다가가지 않고 멈춰 서면, 개가 스스로 다가올지 정할 수 있어요. 이 선택권이 신뢰의 시작입니다.'},
 {id:'greet',    u:0, i:'🤝', n:'손바닥 인사', g:'stay', gi:'✋', gn:'손바닥 펴기',
  why:'손등이 아니라 손바닥을 낮게 보여 주세요. 위에서 덮치듯 내미는 손은 개에게 위협으로 읽힙니다.'},
 {id:'wait',     u:0, i:'⏳', n:'기다리기', g:'stay',   gi:'✋', gn:'한 번만 신호',
  why:'같은 말을 반복하면 개는 더 헷갈려 합니다. 한 번 신호하고 기다리는 것이 훨씬 잘 전달돼요.'},
 {id:'sit',      u:1, i:'🪑', n:'앉아', g:'sit',        gi:'☝️', gn:'검지 들기',
  why:'앉기는 흥분을 낮추는 가장 쉬운 자세예요. 다른 모든 훈련의 출발점이 됩니다.'},
 {id:'down',     u:1, i:'🛋️', n:'엎드려', g:'down',     gi:'✊', gn:'주먹 쥐기',
  why:'엎드리기는 앉기보다 더 안정된 자세라, 오래 기다려야 하는 상황에서 개가 덜 힘들어합니다.'},
 {id:'paw',      u:1, i:'🐾', n:'손', g:'paw',          gi:'✌️', gn:'브이 만들기',
  why:'앞발을 내주는 건 개에게 꽤 취약한 자세예요. 이걸 해 준다면 신뢰가 쌓였다는 뜻입니다.'},
 {id:'timing',   u:2, i:'⏱️', n:'보상 타이밍', g:'praise', gi:'👍', gn:'엄지 들기',
  why:'행동이 끝나고 몇 초가 지나 칭찬하면, 개는 그 사이에 한 다른 행동을 칭찬받았다고 이해합니다.'},
 {id:'short',    u:2, i:'✨', n:'짧은 칭찬', g:'praise', gi:'👍', gn:'엄지 들기',
  why:'길고 흥분된 칭찬은 개를 다시 들뜨게 만들어요. 짧고 분명한 칭찬이 행동을 더 잘 남깁니다.'},
 {id:'calm',     u:3, i:'🌊', n:'흥분 대처', g:'stay',   gi:'✋', gn:'자극 멈추기',
  why:'흥분한 개를 제압하려 하면 더 흥분합니다. 자극을 멈추고 거리를 주는 것이 먼저예요.'},
 {id:'stranger', u:3, i:'🚶', n:'낯선 손', g:'stay',     gi:'✋', gn:'옆에서 천천히',
  why:'정면에서 머리 위로 오는 손이 개가 가장 무서워하는 손이에요. 옆에서 턱 아래로 가는 법을 배웁니다.'}
];

/* ═══════════ 저장 상태 ═══════════ */
var KEY='mung-pet-v1';
var DEF={v:1,name:'멍이',bond:0,lastAt:0,lastDay:'',streak:0,
         learned:[],stars:{},care:{},careDay:'',visits:0};
var G=null;
var DECAY_PER_DAY=6;
function lv(b){return Math.max(1,Math.min(6,1+Math.floor(b/20)));}
function lvName(l){return ['낯선 사이','조금 익숙','편안해짐','믿는 사이','단짝','한 몸같이'][l-1];}
/* 감쇠는 실제로 일어나되 0으로는 가지 않는다 — 쌓은 관계가 통째로 사라지진 않는다 */
function floorOf(b){return (lv(b)-1)*8;}
function today(){var d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function load(){var o={};try{o=JSON.parse(localStorage.getItem(KEY)||'{}');}catch(e){}
  G={};for(var k in DEF)G[k]=(o[k]!=null)?o[k]:DEF[k];
  if(!Array.isArray(G.learned))G.learned=[];
  if(typeof G.stars!=='object'||!G.stars)G.stars={};
  if(typeof G.care!=='object'||!G.care)G.care={};
  return G;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(G));}catch(e){}}
function addBond(v,why){
  var before=lv(G.bond);
  G.bond=Math.max(0,Math.min(100,G.bond+v));
  save();paintHome();
  if(lv(G.bond)>before)setTimeout(function(){say('레벨 업! '+lvName(lv(G.bond)));toast('Lv '+lv(G.bond)+' · '+lvName(lv(G.bond)));},400);
  else if(why)toast(why);
}

/* ═══════════ 강아지 그리기 ═══════════ */
var sheet=new Image(),sheetOk=false;
sheet.onload=function(){sheetOk=true;};
sheet.onerror=function(){sheetOk=false;drawFallback();};
sheet.src='./assets/mungschool-dog-motion-v2.webp';
var cv=$('dogCv'),cx=cv.getContext('2d');
function drawFallback(){
  cx.clearRect(0,0,313,313);
  cx.font='150px serif';cx.textAlign='center';cx.textBaseline='middle';
  cx.fillText('🐕',157,165);
}
var bob=0,mood=0;
function drawDog(){
  bob+=.03;
  if(!sheetOk){requestAnimationFrame(drawDog);return;}
  var C=4,W=sheet.naturalWidth/C,H=sheet.naturalHeight/C;
  var idx=0;                                   // 프레임 0 = 서 있기
  var col=idx%C,row=Math.floor(idx/C),pad=2;
  cx.clearRect(0,0,313,313);
  cx.save();
  var s=1+Math.sin(bob)*0.012, dy=Math.sin(bob*1.15)*3;
  cx.translate(157,157+dy);cx.scale(s,2-s);cx.translate(-157,-157);
  cx.drawImage(sheet,col*W+pad,row*H+pad,W-pad*2,H-pad*2,0,0,313,313);
  cx.restore();
  requestAnimationFrame(drawDog);
}
drawDog();

var bubT=0;
function say(msg,ms){
  clearTimeout(bubT);
  var b=$('bubble');b.textContent=msg;b.classList.add('on');
  bubT=setTimeout(function(){b.classList.remove('on');},ms||2600);
}
var toT=0;
function toast(msg){
  clearTimeout(toT);
  var t=$('toast');t.textContent=msg;t.classList.add('on');
  toT=setTimeout(function(){t.classList.remove('on');},2200);
}

/* ═══════════ 홈 ═══════════ */
function paintHome(){
  var l=lv(G.bond),base=(l-1)*20,into=G.bond-base;
  $('cBond').textContent=Math.round(G.bond);
  $('cStreak').textContent=G.streak;
  $('cSkill').textContent=G.learned.length;
  $('lvFill').style.width=Math.min(100,into/20*100)+'%';
  $('lvL').textContent='Lv '+l+' · '+lvName(l);
  $('lvR').textContent=Math.round(into)+' / 20';
  // 케어 오늘 상태
  if(G.careDay!==today()){G.careDay=today();G.care={};save();}
  document.querySelectorAll('[data-care]').forEach(function(b){
    b.classList.toggle('done',!!G.care[b.getAttribute('data-care')]);
  });
  // 새 훈련 알림 점
  var next=nextSkill();
  var old=$('btnLearn').querySelector('.dotNew'); if(old)old.remove();
  if(next){var d=document.createElement('div');d.className='dotNew';$('btnLearn').appendChild(d);}
}
function nextSkill(){
  for(var i=0;i<SKILLS.length;i++) if(G.learned.indexOf(SKILLS[i].id)<0) return SKILLS[i];
  return null;
}
var CARE_MSG={food:['맛있게 먹었어요!','🍚 밥 +2'],water:['시원해요!','💧 물 +2'],play:['신난다!','🎾 놀기 +3']};
document.querySelectorAll('[data-care]').forEach(function(b){
  b.addEventListener('click',function(){
    var k=b.getAttribute('data-care');
    if(G.care[k]){say('아까 했어요, 고마워요');return;}
    G.care[k]=1;save();
    b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop');
    say(CARE_MSG[k][0]);
    addBond(k==='play'?3:2,CARE_MSG[k][1]);
  });
});

/* ═══════════ 화면 이동 ═══════════ */
function go(id){
  document.querySelectorAll('.scr').forEach(function(s){s.classList.toggle('on',s.id===id);});
  if(id==='tree')paintTree();
  if(id==='train')paintTrain();
  if(id==='home')paintHome();
}
document.querySelectorAll('[data-go]').forEach(function(b){
  b.addEventListener('click',function(){go(b.getAttribute('data-go'));});
});
$('btnTrain').addEventListener('click',function(){go('train');});
$('btnLearn').addEventListener('click',function(){go('tree');});

/* ═══════════ 스킬트리 ═══════════ */
function stateOf(sk){
  if(G.learned.indexOf(sk.id)>=0)return 'done';
  var n=nextSkill();
  return (n&&n.id===sk.id)?'cur':'locked';
}
function paintTree(){
  var h='',lastU=-1,n=0;
  SKILLS.forEach(function(sk,i){
    if(sk.u!==lastU){
      lastU=sk.u;
      h+='<div class="unit '+UNITS[sk.u].c+'"><b>'+(sk.u+1)+'. '+UNITS[sk.u].t+'</b><small>'+UNITS[sk.u].s+'</small></div><div class="path">';
    }
    var st=stateOf(sk);
    var off=(n%3===1)?'off1':(n%3===2)?'off2':'';n++;
    var stars=G.stars[sk.id]||0;
    h+='<button class="node '+st+' '+off+'" data-sk="'+sk.id+'">'
      +'<span class="ball">'+(st==='locked'?'🔒':sk.i)+'</span>'
      +'<span class="lb">'+sk.n+'</span>'
      +'<span class="stars">'+(st==='done'?('★★★'.slice(0,stars)+'☆☆☆'.slice(0,3-stars)):'')+'</span></button>';
    var nx=SKILLS[i+1];
    if(nx&&nx.u===sk.u)h+='<div class="link"></div>';
    if(!nx||nx.u!==sk.u)h+='</div>';
  });
  $('treeScroll').innerHTML=h;
  var done=G.learned.length;
  $('treeSub').textContent=done>=SKILLS.length?'모든 기술을 배웠어요! 연습으로 별을 채워 보세요'
                                              :(done+'개 배움 · 다음은 '+(nextSkill()||{}).n);
  $('treeScroll').querySelectorAll('[data-sk]').forEach(function(b){
    b.addEventListener('click',function(){openSheet(b.getAttribute('data-sk'));});
  });
}

/* ═══════════ 스킬 시트 ═══════════ */
var curSk=null;
function openSheet(id){
  var sk=SKILLS.filter(function(s){return s.id===id;})[0];if(!sk)return;
  curSk=sk;
  var st=stateOf(sk);
  $('sheetIcon').textContent=st==='locked'?'🔒':sk.i;
  $('sheetName').textContent=sk.n;
  $('sheetWhy').textContent=sk.why;
  $('sheetHg').textContent=sk.gi;$('sheetHn').textContent=sk.gn;
  $('sheetHs').textContent='카메라에 이 손모양을 보여 주면 신호가 전달돼요';
  var go=$('sheetGo');
  if(st==='locked'){
    go.className='lock';go.textContent='앞 기술을 먼저 배워 주세요';
  }else{
    go.className='';go.textContent=(st==='done'?'다시 연습하기':'배우러 가기');
  }
  $('sheet').classList.add('on');
}
$('sheetClose').addEventListener('click',function(){$('sheet').classList.remove('on');});
$('sheet').addEventListener('click',function(e){if(e.target.id==='sheet')$('sheet').classList.remove('on');});
$('sheetGo').addEventListener('click',function(){
  if(!curSk||stateOf(curSk)==='locked')return;
  startTraining(curSk);
});

/* ═══════════ 훈련하기 목록 ═══════════ */
function paintTrain(){
  var got=SKILLS.filter(function(s){return G.learned.indexOf(s.id)>=0;});
  if(!got.length){
    $('trainList').innerHTML='<div class="empty">아직 배운 기술이 없어요.<br>«새 훈련 배우기»에서 첫 기술을 배워 보세요.</div>';
    return;
  }
  var h='';
  got.forEach(function(sk){
    var st=G.stars[sk.id]||0;
    h+='<button class="tRow" data-sk="'+sk.id+'"><span class="ti">'+sk.i+'</span>'
      +'<span class="tn"><b>'+sk.n+'</b><small>'+('★★★'.slice(0,st)+'☆☆☆'.slice(0,3-st))+' · '+sk.gn+'</small></span>'
      +'<span class="tg">'+sk.gi+'</span></button>';
  });
  $('trainList').innerHTML=h;
  $('trainList').querySelectorAll('[data-sk]').forEach(function(b){
    b.addEventListener('click',function(){openSheet(b.getAttribute('data-sk'));});
  });
}

/* ═══════════ 훈련 화면으로 (기존 손추적 엔진) ═══════════ */
function startTraining(sk){
  G.lastAt=Date.now();save();
  // 기존 엔진에 어떤 기술을 연습하는지 넘긴다. 돌아오면 결과를 읽어 반영한다.
  try{ localStorage.setItem('mung-pending-skill',JSON.stringify(
    {id:sk.id,name:sk.n,gesture:sk.g,at:Date.now()})); }catch(e){}
  location.href='./mobile.html?skill='+encodeURIComponent(sk.id)+'&from=app';
}

/* 훈련에서 돌아왔을 때 결과 반영 */
function consumeResult(){
  var r=null;
  try{ r=JSON.parse(localStorage.getItem('mung-skill-result')||'null'); }catch(e){}
  if(!r||!r.id)return false;
  try{ localStorage.removeItem('mung-skill-result'); }catch(e){}
  var sk=SKILLS.filter(function(s){return s.id===r.id;})[0];
  if(!sk)return false;
  var first=G.learned.indexOf(sk.id)<0;
  if(first)G.learned.push(sk.id);
  var st=Math.max(G.stars[sk.id]||0,Math.max(0,Math.min(3,r.stars|0)));
  G.stars[sk.id]=st;save();
  setTimeout(function(){
    say(first?(sk.n+' 배웠어요!'):'더 잘하게 됐어요!');
    addBond(first?10:4,first?('🎓 '+sk.n+' 해금 · 유대 +10'):('유대 +4 · '+('★'.repeat(st))));
  },500);
  return true;
}

/* ═══════════ 재회 (다마고치) ═══════════ */
function reunion(done){
  var first=!G.lastAt,days=0,lost=0;
  if(G.lastAt){
    days=(Date.now()-G.lastAt)/86400000;
    if(days>=1){
      var fl=floorOf(G.bond);
      lost=Math.max(0,Math.min(Math.floor(days)*DECAY_PER_DAY,G.bond-fl));
      G.bond=Math.max(fl,G.bond-lost);
    }
  }
  var d=today();
  if(G.lastDay!==d){
    var y=new Date(Date.now()-86400000);
    var ys=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
    G.streak=(G.lastDay===ys)?(G.streak+1):1;
    G.lastDay=d;
  }
  G.visits++;G.lastAt=Date.now();save();

  var emo,title,msg;
  if(first){emo='🐶';title=G.name+'를 처음 만났어요';msg='아직 서로를 잘 몰라요. 서두르지 않는 것부터 배워 볼까요?';}
  else if(days<1){emo='🐕';title='다시 왔군요!';msg=G.name+'가 꼬리를 흔들며 달려옵니다.';}
  else if(days<3){emo='🐕';title=Math.floor(days)+'일 만이에요';msg=G.name+'가 문 쪽을 보고 기다리고 있었어요.';}
  else if(days<8){emo='🐩';title=Math.floor(days)+'일 만이에요';msg=G.name+'가 조금 머뭇거려요. 천천히 다시 다가가 볼까요.';}
  else {emo='🐕‍🦺';title='오랜만이에요';msg=G.name+'가 처음처럼 조심스러워요. 관계는 다시 쌓으면 됩니다.';}

  $('reEmo').textContent=emo;$('reTitle').textContent=title;$('reMsg').textContent=msg;
  var dl=$('reDelta');
  if(lost>0){dl.textContent='유대 −'+Math.round(lost)+' · 오지 않은 사이 조금 옅어졌어요';dl.className='down';}
  else if(G.streak>1){dl.textContent='🔥 '+G.streak+'일 연속이에요!';dl.className='up';}
  else {dl.textContent='';dl.className='';}
  $('reunion').classList.add('on');
  $('reGo').onclick=function(){$('reunion').classList.remove('on');done&&done();};
}

/* ═══════════ 부팅 ═══════════ */
load();
var back=consumeResult();
paintHome();
if(back){
  // 훈련 갔다 돌아온 것이므로 재회 카드는 띄우지 않는다
  G.lastAt=Date.now();save();
}else{
  reunion(function(){
    var n=nextSkill();
    if(!G.learned.length&&n)setTimeout(function(){say('무엇부터 배워 볼까요?');},700);
  });
}
setInterval(function(){G.lastAt=Date.now();save();},20000);
addEventListener('pagehide',function(){G.lastAt=Date.now();save();});

window.__PET__={state:function(){return G;},skills:SKILLS,
  go:go,addBond:addBond,
  learn:function(id,st){G.learned.indexOf(id)<0&&G.learned.push(id);G.stars[id]=st||1;save();paintHome();},
  reset:function(){try{localStorage.removeItem(KEY);}catch(e){}location.reload();}};
})();
</script>
</body>
</html>
